<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>几何任务栏小插件 · 设置</title>
<style>
  :root {
    --bg: #1e2129;
    --card: #262a34;
    --line: rgba(255, 255, 255, 0.10);
    --line-strong: rgba(255, 255, 255, 0.18);
    --fg: #e8ecf4;
    --fg-dim: #97a1b4;
    --accent: #73aae1;
    --accent-dim: rgba(115, 170, 225, 0.16);
    --danger: #e07a7a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font: 13px/1.6 "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
    user-select: none;
  }
  .wrap { padding: 16px 18px 12px; display: flex; flex-direction: column; height: 100%; }
  header { margin-bottom: 14px; }
  h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: .5px; }
  .sub { margin: 3px 0 0; color: var(--fg-dim); font-size: 12px; }

  section {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  h2 {
    margin: 0 0 8px; font-size: 11px; font-weight: 600;
    color: var(--fg-dim); letter-spacing: 1.4px; text-transform: uppercase;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 5px 0; }
  .row + .row { border-top: 1px solid var(--line); }
  label { color: var(--fg); font-size: 12.5px; }
  label b { color: var(--accent); font-weight: 600; margin-left: 2px; }

  .seg { display: flex; gap: 2px; background: rgba(0, 0, 0, .22); border-radius: 7px; padding: 2px; }
  .seg button {
    border: 0; background: transparent; color: var(--fg-dim);
    font: inherit; font-size: 12px; padding: 3px 9px; border-radius: 5px;
    cursor: pointer; transition: background .15s, color .15s;
  }
  .seg button:hover { color: var(--fg); }
  .seg button.on { background: var(--accent-dim); color: var(--accent); }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 150px; height: 4px; border-radius: 2px;
    background: rgba(255, 255, 255, .14); outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%;
    background: var(--accent); cursor: pointer;
    box-shadow: 0 0 0 4px rgba(115, 170, 225, .16);
  }

  button.danger {
    border: 1px solid rgba(224, 122, 122, .45);
    background: rgba(224, 122, 122, .12); color: var(--danger);
    font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 6px; cursor: pointer;
  }
  button.danger:hover { background: rgba(224, 122, 122, .22); }
  button.danger.arm { background: rgba(224, 122, 122, .3); color: #fff; }

  .hint { margin: 6px 0 0; font-size: 11.5px; color: var(--fg-dim); }

  footer {
    margin-top: auto; padding-top: 8px; border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11.5px; color: var(--fg-dim);
  }
  #saveState.ok { color: var(--accent); }
  a { color: var(--fg-dim); text-decoration: none; }
  a:hover { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>几何任务栏小插件 · 设置</h1>
    <p class="sub">改完即时生效，下次启动也会记得</p>
  </header>

  <section>
    <h2>外观</h2>
    <div class="row">
      <label>主题</label>
      <div class="seg" id="segTheme">
        <button data-v="auto">自动</button>
        <button data-v="spring">春</button>
        <button data-v="summer">夏</button>
        <button data-v="autumn">秋</button>
        <button data-v="winter">冬</button>
        <button data-v="night">夜</button>
      </div>
    </div>
    <div class="row">
      <label>几何体大小</label>
      <div class="seg" id="segScale">
        <button data-v="0.26">小</button>
        <button data-v="0.32">中</button>
        <button data-v="0.38">大</button>
      </div>
    </div>
  </section>

  <section>
    <h2>手感</h2>
    <div class="row">
      <label>几何体停留 <b id="idleVal">1.5 秒</b></label>
      <input type="range" id="idle" min="0.6" max="3" step="0.1" value="1.5">
    </div>
    <div class="row">
      <label>动画速度</label>
      <div class="seg" id="segSpeed">
        <button data-v="0.6">慢</button>
        <button data-v="1">正常</button>
        <button data-v="1.5">快</button>
      </div>
    </div>
  </section>

  <section>
    <h2>显示</h2>
    <div class="row">
      <label>季节粒子（右侧）</label>
      <div class="seg" id="segTrail">
        <button data-v="1">开</button>
        <button data-v="0">关</button>
      </div>
    </div>
    <div class="row">
      <label>成就区</label>
      <div class="seg" id="segHud">
        <button data-v="full">完整</button>
        <button data-v="numbers">仅数字</button>
        <button data-v="none">隐藏</button>
      </div>
    </div>
  </section>

  <section>
    <h2>数据</h2>
    <div class="row">
      <label>打字统计</label>
      <button class="danger" id="reset">重置统计</button>
    </div>
    <p class="hint" id="resetHint">重置会清空「今日 / 累计」与已解锁的徽章进度，不可撤销。</p>
  </section>

  <footer>
    <span id="saveState"></span>
    <a href="https://github.com/dustcpu/Geometric-Counter" target="_blank" rel="noopener">v0.1.1 · MIT</a>
  </footer>
</div>

<script>
(function () {
  'use strict';

  var DEFAULTS = {
    theme: 'auto',
    idleTime: 1.5,
    speed: 1,
    scale: 0.32,
    trail: 1,
    hud: 'full'
  };
  var S = Object.assign({}, DEFAULTS);
  var saveState = document.getElementById('saveState');
  var saveTimer = null;

  function invoke(cmd, args) {
    var t = window.__TAURI_INTERNALS__;
    if (!t || !t.invoke) return Promise.reject(new Error('no tauri'));
    return t.invoke(cmd, args || {});
  }

  // ---- 分段按钮 ----
  function paintSeg(id, value) {
    var box = document.getElementById(id);
    var btns = box.querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('on', btns[i].dataset.v === String(value));
    }
  }
  function bindSeg(id, key) {
    var box = document.getElementById(id);
    box.addEventListener('click', function (ev) {
      var b = ev.target.closest('button');
      if (!b) return;
      S[key] = b.dataset.v;
      paintSeg(id, S[key]);
      save();
    });
  }

  function paintAll() {
    paintSeg('segTheme', S.theme);
    paintSeg('segScale', String(S.scale));
    paintSeg('segSpeed', String(S.speed));
    paintSeg('segTrail', String(S.trail));
    paintSeg('segHud', S.hud);
    document.getElementById('idle').value = S.idleTime;
    document.getElementById('idleVal').textContent = Number(S.idleTime).toFixed(1) + ' 秒';
  }

  // ---- 保存（防抖 200ms）----
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      invoke('save_settings', { json: JSON.stringify(S) }).then(function () {
        saveState.textContent = '已同步 ✓';
        saveState.classList.add('ok');
        setTimeout(function () { saveState.classList.remove('ok'); }, 1200);
      }).catch(function () {
        saveState.textContent = '保存失败';
      });
    }, 200);
  }

  // ---- 载入 ----
  var load = (window.__OCEAN_SETTINGS && typeof window.__OCEAN_SETTINGS === 'object')
    ? Promise.resolve(window.__OCEAN_SETTINGS)
    : invoke('get_settings').then(function (s) {
        try { return JSON.parse(s || '{}'); } catch (e) { return {}; }
      });

  load.then(function (obj) {
    S = Object.assign({}, DEFAULTS, obj || {});
    // 归一化数值（避免旧配置里的字符串混进来）
    S.idleTime = Math.min(3, Math.max(0.6, Number(S.idleTime) || DEFAULTS.idleTime));
    S.speed = Number(S.speed) || 1;
    S.scale = Number(S.scale) || DEFAULTS.scale;
    S.trail = String(S.trail) === '0' ? 0 : 1;
    paintAll();
  });

  bindSeg('segTheme', 'theme');
  bindSeg('segScale', 'scale');
  bindSeg('segSpeed', 'speed');
  bindSeg('segTrail', 'trail');
  bindSeg('segHud', 'hud');

  var idle = document.getElementById('idle');
  idle.addEventListener('input', function () {
    S.idleTime = Number(idle.value);
    document.getElementById('idleVal').textContent = S.idleTime.toFixed(1) + ' 秒';
    save();
  });

  // ---- 重置统计（二次确认）----
  var resetBtn = document.getElementById('reset');
  var armed = false;
  resetBtn.addEventListener('click', function () {
    if (!armed) {
      armed = true;
      resetBtn.classList.add('arm');
      resetBtn.textContent = '再点一次确认';
      setTimeout(function () {
        armed = false;
        resetBtn.classList.remove('arm');
        resetBtn.textContent = '重置统计';
      }, 4000);
      return;
    }
    armed = false;
    resetBtn.classList.remove('arm');
    resetBtn.textContent = '重置统计';
    invoke('reset_stats').then(function () {
      saveState.textContent = '统计已重置';
    }).catch(function () {
      saveState.textContent = '重置失败';
    });
  });
})();
</script>
</body>
</html>
