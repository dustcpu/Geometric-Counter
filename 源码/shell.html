<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>几何任务栏小插件</title>
<link rel="stylesheet" href="style.css?v=20260919-8">
<script>
// 页面 JS 崩溃哨兵：把错误写进窗口标题，供外部探针读取（桌面壳无控制台）
window.onerror = function (msg, src, line) {
  try { document.title = 'JSERR L' + line + ': ' + msg; } catch (e) { }
};
</script>
<style>
  /* ============ 桌面壳专用样式（仅覆盖必要项）============
     窗口覆盖 78–1290（逻辑 1212×48），中间 546–1043 由 Rust 侧的窗口区域挖空。
     视觉走 Win11 卡片风：两块圆角小板 + 1px 微光描边，击键时描边短暂高亮。
     画布沿用全带坐标系，canvas 用 ctx.translate(-78, 0) 平移对齐。 */
  html, body { margin: 0; padding: 0; background: #1e2129; overflow: hidden; }
  .band-outer { position: absolute; top: 0; left: 0; }
  .band {
    width: 1212px;                   /* = 窗口宽（78→1290） */
    height: 48px;
    border-radius: 0;
    border: none;
    box-shadow: none;
    background: transparent;
  }

  /* ---- Win11 卡片：只有左侧海面卡（描边+悬停高亮）----
     右侧粒子区：无描边、无高亮，只有深色底 + 粒子（底色即 body 色） */
  .plate {
    position: absolute;
    top: 3px;
    height: calc(100% - 5px);        /* 与 region 内缩一致：顶 3 / 底 2 */
    background: #1e2129;
    border: 1px solid rgba(255, 255, 255, 0.20);
    border-radius: 8px;
    box-sizing: border-box;
    pointer-events: none;
    z-index: 0;
    /* ★ 描边亮度必须整圈一致（Dust 2026-09-19）：
       试过「两端渐隐」（方案③：中段亮、端部弱）——实机看反而亮度不匀、更奇怪，已撤销。
       这里**不要**再加 mask / 渐变；要高亮就整圈一起亮（见 tickGlow）。 */
  }
  #plateLeft  { left: 2px;   width: 464px; }   /* region 左板 2..466 */
  /* 图腾亮度随解锁进度平滑变化（未集齐半透明 → 全放生全亮） */
  .achv-badges { transition: opacity .8s ease; }
  .band canvas { z-index: 1; }
  .achv { z-index: 2; }
  .achv { left: 300px; }             /* 378(带坐标) − 78(窗口偏移) = 300 */
</style>
</head>
<body>
  <div class="band-outer" id="bandOuter">
    <div class="band" id="band">
      <div class="plate" id="plateLeft"></div>
      <canvas id="bandCanvas"></canvas>

      <!-- 成就区：徽章（单枚陈列）+ 今日/累计 -->
      <div class="achv">
        <div class="achv-badges" id="achvBadges"></div>
        <div class="achv-total" id="achvTotal">今日 0 ｜ 累计 0</div>
      </div>
    </div>
  </div>

  <!-- 模块（顺序依赖：config → theme/shapes/ocean/badges/keyboard → fountain/achievements） -->
  <script src="src/config.js?v=20260919-8"></script>
  <script src="src/theme.js?v=20260919-8"></script>
  <script src="src/shapes.js?v=20260919-8"></script>
  <script src="src/ocean.js?v=20260919-8"></script>
  <script src="src/badges.js?v=20260919-8"></script>
  <script src="src/keyboard-source.js?v=20260919-8"></script>
  <script src="src/fountain.js?v=20260919-8"></script>
  <script src="src/trail.js?v=20260919-8"></script>
  <script src="src/achievements.js?v=20260919-8"></script>
  <script>
  (function () {
    var cfg = GOW.config;
    var WINX = cfg.zone.x;      // 窗口左缘（逻辑）——Rust 侧按任务栏实测布局动态决定
    var WINW = 1212;            // 窗口宽（逻辑）——同上

    var canvas = document.getElementById('bandCanvas');
    var ctx = canvas.getContext('2d');
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var outer = document.getElementById('bandOuter');
    var band = document.getElementById('band');
    var plateLeft = document.getElementById('plateLeft');
    var achvEl = document.querySelector('.achv');

    // ---- 画布几何：随布局重设（改 width 会重置变换，所以每次重设 setTransform）----
    function setCanvasGeometry() {
      canvas.width = WINW * dpr;
      canvas.height = cfg.H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, -WINX * dpr, 0);   // 平移对齐全带坐标系
    }

    // ---- 尺寸自适应（正常 s=1；防御性保留）----
    function fit() {
      var s = Math.min(1, window.innerWidth / WINW, window.innerHeight / cfg.H);
      outer.style.width = (WINW * s) + 'px';
      outer.style.height = (cfg.H * s) + 'px';
      band.style.transform = 'scale(' + s + ')';
    }

    // ---- 自适应布局：Rust 实测任务栏（开始按钮 / 托盘 位置）后推过来 ----
    //     解决「换台电脑分辨率不同 → 卡片压住图标」的问题；同时兼作分辨率变化重定位。
    var lastLayoutRev = -1;
    function applyLayout(L) {
      WINX = L.winX;
      WINW = L.winW;
      cfg.zone.x = L.zoneX;
      cfg.zone.width = L.zoneW;
      cfg.fountain.x = cfg.zone.x;
      cfg.achievements.x = cfg.zone.x + cfg.fountain.width;
      cfg.rightZone.x = L.rightX;
      cfg.rightZone.width = L.rightW;
      setCanvasGeometry();
      fit();
      // 取整：描边落在整像素上才清晰、四边亮度才一致
      //（小数位置会让竖边落在半像素上发虚，看上去比上下两条横线暗）
      plateLeft.style.left = Math.round(L.zoneX - L.winX) + 'px';
      plateLeft.style.width = Math.round(L.zoneW) + 'px';
      achvEl.style.left = Math.round(cfg.achievements.x - L.winX) + 'px';
      GOW.fountain.init();     // 区域变了 → 槽位重建（旧几何体绝对坐标已失效）
    }

    setCanvasGeometry();
    window.addEventListener('resize', fit);
    fit();

    // Rust 只在布局变化时改动 rev；这里 300ms 轮询，晚加载也能拿到
    setInterval(function () {
      var L = window.__LAYOUT;
      if (L && L.rev !== lastLayoutRev) {
        lastLayoutRev = L.rev;
        try { applyLayout(L); } catch (e) { }
      }
    }, 300);

    // ---- 成就区 DOM：永久陈列自转的彭罗斯三角（★ 2026-09-19 新语义）----
    // 不再是「最新解锁的那枚徽章」——徽章轮换取消，改为「图腾常驻 + 逐级放生几何体」：
    //   未集齐时图腾半透明，全部放生后全亮；右下角仍是今日/累计数字。
    var badgesEl = document.getElementById('achvBadges');
    var totalEl = document.getElementById('achvTotal');
    var TOTEM = GOW.BADGES[GOW.BADGES.length - 1];     // 彭罗斯三角
    var totemReady = false;
    function renderBadges(unlockedCount) {
      if (!totemReady) {
        var div = document.createElement('div');
        div.className = 'badge';
        div.innerHTML = TOTEM.svg;
        badgesEl.appendChild(div);
        totemReady = true;
      }
      var done = unlockedCount >= cfg.levels.length;
      badgesEl.style.opacity = done ? '1' : '0.42';
      badgesEl.title = done
        ? '彭罗斯三角 · 几何体已全部放生'
        : '彭罗斯三角 · 已放生 ' + unlockedCount + ' / ' + cfg.levels.length + ' 种几何体';
    }

    // ---- 存档：桌面版双写（localStorage + JSON 文件）----
    //     文件由 Rust 写：%LOCALAPPDATA%\GeometricCounter\stats.json
    //     连接时 Rust 会把文件内容以 { init: {...} } 推回来 → 单调合并，不会倒扣进度
    var wsHandle = null;
    function desktopStorage() {
      return {
        load: function () {
          try { return JSON.parse(localStorage.getItem(cfg.storageKey) || 'null'); }
          catch (e) { return null; }
        },
        save: function (s) {
          try { localStorage.setItem(cfg.storageKey, JSON.stringify(s)); } catch (e) { }
          if (wsHandle && wsHandle.send) wsHandle.send(JSON.stringify(s));
        }
      };
    }

    // ★ 随机浮出池 = 基础池 + 已放生的几何体（成就驱动）
    function applyPool() {
      try { GOW.fountain.setPool(GOW.achievements.unlockedTypes()); } catch (e) { }
    }

    GOW.achievements.init({
      renderBadges: renderBadges,
      setTotal: function () { },
      storage: (typeof window.__TAURI_INTERNALS__ !== 'undefined') ? desktopStorage() : null,
      // 只在「实时升到新级别」时触发：放生新几何体 + 弹小窗（启动补算/存档合并不触发）
      onUnlock: function (lv) {
        applyPool();
        if (typeof window.__TAURI_INTERNALS__ !== 'undefined') {
          try {
            window.__TAURI_INTERNALS__.invoke('show_unlock', { level: lv }).catch(function () { });
          } catch (e) { }
        }
      }
    });
    applyPool();
    var dispTotal = GOW.achievements.stats().total;
    var dispToday = GOW.achievements.stats().today.count;
    var lastTotalTxt = '';

    // ---- 键盘数据源（自动选择）----
    // 2a（默认）：WS 不在线 → 回退页面内键盘（点击窗口获取焦点后敲键有效）
    // 2b（--global，WS 服务在线）：全局钩子事件接管（无需焦点）
    GOW.fountain.init();
    (function attachSource(onKey) {
      var inTauri = typeof window.__TAURI_INTERNALS__ !== 'undefined';
      if (!inTauri) {
        GOW.keyboard.createWebSource(onKey);
        return;
      }
      var wsOnline = false;
      wsHandle = GOW.keyboard.createWebSocketSource(
        'ws://127.0.0.1:27183',
        onKey,
        function () { wsOnline = true; },              // 连接建立即视为在线（2b）
        function (msg) {                               // 非按键消息：JSON 存档
          if (msg && msg.init) GOW.achievements.merge(msg.init);
        }
      );
      setTimeout(function () {
        if (!wsOnline) GOW.keyboard.createWebSource(onKey);   // 2a / 无服务
      }, 1200);
    })(function (ev) {
      GOW.achievements.recordKey(ev.zone);
      GOW.fountain.trySpawn(ev.zone);
      if (trailOn) GOW.trail.onKey();
      bumpGlow();
    });

    // ---- 描边高亮：悬停常亮（Rust 推送 __OCEAN_HOVER）+ 击键脉冲，取较强者 ----
    var plates = [
      document.getElementById('plateLeft')   // 右板已去卡化——只有左卡参与高亮
    ];
    var hoverOn = false, keyT = 0, glowReset = true;
    function bumpGlow() { keyT = 1; glowReset = false; }
    setInterval(function () {
      var v = window.__OCEAN_HOVER === true;
      if (v !== hoverOn) { hoverOn = v; glowReset = false; }
    }, 100);
    function tickGlow(rawDt) {
      if (keyT > 0) keyT = Math.max(0, keyT - rawDt / 0.35);
      var g = hoverOn ? 1 : keyT;            // 悬停常亮 ≥ 击键脉冲
      if (g <= 0) {
        if (!glowReset) {                    // 归位一次即可，避免每帧写样式
          for (var i = 0; i < plates.length; i++) {
            plates[i].style.borderColor = 'rgba(255,255,255,0.20)';
            plates[i].style.boxShadow = 'none';
          }
          glowReset = true;
        }
        return;
      }
      // 基线 0.20 与 .plate 的静态描边一致；高亮时两端仍会被 mask 按同比例弱化（自然收束）
      var b = 'rgba(255,255,255,' + (0.20 + 0.24 * g).toFixed(3) + ')';
      // 内发光（inset）：外发光会被不透明窗口的 region 裁掉，只有画在卡内才可见
      var sh = 'inset 0 0 9px rgba(115,170,225,' + (0.45 * g).toFixed(3) + ')';
      for (var j = 0; j < plates.length; j++) {
        plates[j].style.borderColor = b;
        plates[j].style.boxShadow = sh;
      }
      glowReset = false;
    }

    // ---- 主循环 ----
    var reduced = false;
    try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { }

    GOW.theme.setAuto();

    // ---- 设置（双击海面打开的设置面板）：启动时经 IPC 拉取，保存时由 Rust 推过来 ----
    var trailOn = true, hudMode = 'full', hudApplied = '';
    function applyHud() {
      if (hudMode === hudApplied) return;
      hudApplied = hudMode;
      badgesEl.style.display = (hudMode === 'full') ? '' : 'none';
      totalEl.style.display = (hudMode === 'none') ? 'none' : '';
    }
    function applySettings(s) {
      if (!s || typeof s !== 'object') return;
      // 主题
      var th = String(s.theme || 'auto');
      if (th === 'auto') GOW.theme.setAuto();
      else if (th === 'night') GOW.theme.setMode('night');
      else if (th === 'spring' || th === 'summer' || th === 'autumn' || th === 'winter') GOW.theme.setSeason(th);
      // 悬停存活时长（打字注入可续命）
      var idle = Number(s.idleTime);
      if (idle >= 0.6 && idle <= 3) cfg.idleTime = idle;
      // 动画速度：只缩放浮出与落下，停留时长不受影响
      var sp = Number(s.speed);
      if (sp >= 0.5 && sp <= 2) { cfg.riseDur = 0.4 * sp; cfg.fallDur = 0.4 * sp; }
      // 几何体大小（对之后浮出的生效）
      var sc = Number(s.scale);
      if (sc >= 0.2 && sc <= 0.45) cfg.scale = sc;
      // 季节粒子开关
      trailOn = !(String(s.trail) === '0');
      // 成就区显示
      hudMode = String(s.hud || 'full');
      applyHud();
    }
    if (typeof window.__TAURI_INTERNALS__ !== 'undefined') {
      window.__TAURI_INTERNALS__.invoke('get_settings').then(function (txt) {
        try { applySettings(JSON.parse(txt || '{}')); } catch (e) { }
      }).catch(function () { });
    }
    // 设置面板保存后 Rust 会 eval 到本窗口 → 检测变化并应用
    var lastSettingsJson = '';
    setInterval(function () {
      var s = window.__OCEAN_SETTINGS;
      if (!s) return;
      var j;
      try { j = JSON.stringify(s); } catch (e) { return; }
      if (j === lastSettingsJson) return;
      lastSettingsJson = j;
      applySettings(s);
    }, 300);
    // 设置面板点了「重置统计」
    setInterval(function () {
      if (window.__OCEAN_RESET) {
        window.__OCEAN_RESET = 0;
        try {
          GOW.achievements.reset();
          applyPool();                 // 进度清零 → 随机池退回「只有正方体」
          dispTotal2 = 0;
          dispToday2 = 0;
          lastTotalTxt = '';
        } catch (e) { }
      }
    }, 300);

    var last = performance.now();
    var dispTotal2 = dispTotal, dispToday2 = dispToday;
    function frame(now) {
      requestAnimationFrame(frame);   // ★ 先排下一帧：单帧异常不再杀死整片海
      try {
        var rawDt = Math.min((now - last) / 1000, 0.05);
        last = now;
        var t = now / 1000;
        var dt = reduced ? 0 : rawDt;

        GOW.theme.update(rawDt, reduced);
        GOW.achievements.tick(rawDt);
        GOW.fountain.update(dt);
        if (trailOn) GOW.trail.update(dt);
        tickGlow(rawDt);

        // 清屏：覆盖整个窗口宽（左右两块区域）
        ctx.clearRect(WINX, 0, WINW, cfg.H);
        GOW.ocean.drawWaves(ctx, t);
        GOW.fountain.draw(ctx, t);
        GOW.ocean.drawWaterline(ctx, t);
        if (trailOn) GOW.trail.draw(ctx);
        else GOW.trail.clear();   // 关掉粒子：清空池（幂等，无副作用）

        // 今日/累计数字缓动追值
        var st = GOW.achievements.stats();
        var fNum = 1 - Math.pow(0.0005, rawDt);
        dispTotal2 += (st.total - dispTotal2) * fNum;
        dispToday2 += (st.today.count - dispToday2) * fNum;
        var txt = '今日 ' + Math.round(dispToday2).toLocaleString('zh-CN') +
          ' ｜ 累计 ' + Math.round(dispTotal2).toLocaleString('zh-CN');
        if (txt !== lastTotalTxt) {
          lastTotalTxt = txt;
          totalEl.textContent = txt;
        }

        badgesEl.style.color = GOW.theme.rgb(GOW.theme.display.solid, 0.95);
        totalEl.style.color = GOW.theme.rgb(GOW.theme.display.solid, 0.9);
      } catch (e) {
        // 崩溃哨兵：首个异常写进窗口标题供探针远程读取，后续静默丢帧
        try {
          if (!window.__frameErrLogged) {
            window.__frameErrLogged = 1;
            document.title = 'JSERR frame: ' + (e && e.message ? e.message : e);
          }
        } catch (e2) { }
      }
    }
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
